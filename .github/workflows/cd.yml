name: CD

# Builds and publishes versioned Docker images whenever code lands on main
# (i.e. after a release has gone through develop -> staging -> main),
# then optionally deploys to the EC2 host over SSH.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 (beginner path)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only runs once you've set the ENABLE_DEPLOY repo variable to "true"
    # and added the EC2_HOST / EC2_SSH_USER / EC2_SSH_KEY secrets.
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # The server never needs git, and never builds anything itself - it
      # only needs docker-compose.yml (to know which images/ports to use)
      # plus the nginx/scripts config. Images are already built and pushed
      # by build-and-push above; this job's job is to sync config and
      # restart, not to fetch source. This step also creates the target
      # directory on first run if it doesn't exist yet.
      # Secrets live in GitHub (ENV_FILE), not on your laptop or in git. This
      # writes them to a .env on the runner, which the next step ships to the
      # server alongside docker-compose.yml. Image names are derived here (and
      # lowercased - GHCR requires it) so they always match what
      # build-and-push just published.
      - name: Generate .env from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$ENV_FILE" > .env
          {
            echo "BACKEND_IMAGE=ghcr.io/${REPO_LC}-backend:latest"
            echo "FRONTEND_IMAGE=ghcr.io/${REPO_LC}-frontend:latest"
          } >> .env

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,.env,nginx/**,scripts/**"
          target: "/home/${{ secrets.EC2_SSH_USER }}/dream-vacations"

      - name: Pull latest images and restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/${{ secrets.EC2_SSH_USER }}/dream-vacations
            test -f .env || { echo "Missing .env on server - is the ENV_FILE secret set?"; exit 1; }
            chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f